[project]
name = "rig"
version = "0.1.0"
description = "Transform repositories into queryable engineering graphs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Prajjwal Acharya", email = "a.prajjwal1729@gmail.com" },
]
dependencies = [
    "pathspec>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/pjxcharya/rig"
Issues = "https://github.com/pjxcharya/rig/issues"

[project.scripts]
rig = "rig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rig"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
packages = ["rig", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false
